<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>UtterBox</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
    color: #1e293b;
    background: #f8fafc;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  textarea {
    width: 100%;
    height: 90px;
    resize: vertical;
    padding: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font: inherit;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .row > div { flex: 1; }
  label { display: block; font-size: 11px; color: #64748b; margin-bottom: 3px; }
  select, input[type="range"] {
    width: 100%;
  }
  select {
    padding: 6px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font: inherit;
    background: #fff;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12px;
    color: #475569;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #previewBtn { background: #4f46e5; color: #fff; }
  #downloadBtn { background: #1e293b; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #useSelectionBtn {
    background: none;
    border: 1px dashed #94a3b8;
    color: #475569;
    font-weight: 500;
    padding: 5px 8px;
    margin-top: 6px;
    flex: none;
    width: 100%;
  }
  #status { min-height: 16px; font-size: 12px; color: #64748b; margin-top: 8px; }
  audio { width: 100%; margin-top: 6px; display: none; }
</style>
</head>
<body>
  <h1>🔊 UtterBox</h1>

  <textarea id="text" maxlength="5000" placeholder="输入文本，或点击下方按钮抓取当前页面选中内容…"></textarea>
  <button id="useSelectionBtn">使用当前页面选中文本</button>

  <div class="row">
    <div>
      <label for="voice">发音 / 语言</label>
      <select id="voice"></select>
    </div>
    <div>
      <label for="rate">语速 <span id="rateLabel">0%</span></label>
      <input id="rate" type="range" min="-50" max="50" value="0" step="5" />
    </div>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="saveAs" />
    <label for="saveAs" style="margin:0;">下载时询问保存位置</label>
  </div>

  <div class="actions">
    <button id="previewBtn">▶ 试听</button>
    <button id="downloadBtn">⬇ 下载 MP3</button>
  </div>

  <p id="status"></p>
  <audio id="audioPlayer" controls></audio>

  <script type="module" src="popup.js"></script>
</body>
</html>
