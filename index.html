<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UtterBox · 文字转语音</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:,">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="max-w-2xl mx-auto px-4 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">UtterBox</h1>
      <p class="text-slate-500 mt-1">粘贴文本，选择发音，试听并导出 MP3</p>
    </header>

    <main class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
      <div>
        <label for="text" class="block text-sm font-medium mb-1">文本内容</label>
        <textarea id="text" rows="6" maxlength="5000"
          class="w-full rounded-lg border border-slate-300 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-y"
          placeholder="在这里粘贴或输入要转换的文本…"></textarea>
        <div class="text-xs text-slate-400 mt-1 text-right"><span id="charCount">0</span> / 5000</div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="voice" class="block text-sm font-medium mb-1">发音 / 语言</label>
          <select id="voice" class="w-full rounded-lg border border-slate-300 p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <optgroup label="English (US)">
              <option value="en-US-AriaNeural">Aria（女声）</option>
              <option value="en-US-GuyNeural">Guy（男声）</option>
            </optgroup>
            <optgroup label="English (UK)">
              <option value="en-GB-SoniaNeural">Sonia（女声）</option>
              <option value="en-GB-RyanNeural">Ryan（男声）</option>
            </optgroup>
            <optgroup label="中文">
              <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
              <option value="zh-CN-YunxiNeural">云希（男声）</option>
            </optgroup>
          </select>
        </div>

        <div>
          <label for="rate" class="block text-sm font-medium mb-1">
            语速 <span id="rateLabel" class="text-slate-400">0%</span>
          </label>
          <input id="rate" type="range" min="-50" max="50" value="0" step="5"
            class="w-full mt-3 accent-indigo-500" />
        </div>
      </div>

      <div class="flex flex-wrap gap-3 pt-2">
        <button id="previewBtn"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="previewIcon">▶</span> 试听
        </button>
        <button id="downloadBtn"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-900 disabled:opacity-50 disabled:cursor-not-allowed">
          ⬇ 下载 MP3
        </button>
      </div>

      <p id="status" class="text-sm text-slate-500 min-h-[1.25rem]"></p>
      <audio id="audioPlayer" class="w-full hidden" controls></audio>
    </main>

    <footer class="text-center text-xs text-slate-400 mt-8">
      Powered by Azure Speech · Cloudflare Workers
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
